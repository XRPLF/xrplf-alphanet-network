# Alphanet SDK: what multibranch-builder merges into the xrpl.js integration branch.
# Format: `<owner/repo> <branch> [rebase]`; `rebase` merges the base branch into that
# branch before it is integrated.
base XRPLF/xrpl.js main
target Transia-RnD/xrpl.js alphanet

# definitions.json is not merged: after the merges it is written from this node's
# server_definitions, so compose this conf after the xrpld deploy it must match.
definitions https://alphanet.xrpl.org

# https://github.com/XRPLF/xrpl.js/pull/3274 — [DO NOT MERGE] smart contracts
XRPLF/xrpl.js smart-contracts
