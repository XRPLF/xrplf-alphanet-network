# Alphanet integration branch: what multibranch-builder merges into Transia-RnD/rippled@alphanet.
# Format: `<owner/repo> <branch> [rebase]`; `rebase` merges the base branch into that
# branch before it is integrated.
base XRPLF/rippled develop
target Transia-RnD/rippled alphanet

XRPLF/rippled xrplf/smart-contracts rebase
XRPLF/rippled dangell7/subscriptions rebase
XRPLF/rippled dangell7/datagram rebase
XRPLF/rippled dangell7/export-ledger-name-spaces rebase
# force_supported cmake option lives in this branch; required for the
# --force-supported ON build.
XRPLF/rippled dangell7/supported-cicd rebase
