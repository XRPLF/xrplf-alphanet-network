# Alphanet integration branch: what multibranch-builder merges, in this order, onto the base.
# Format: `<owner/repo> <branch> [rebase]`; `rebase` merges the base branch into that
# branch before it is integrated.
# Order: infrastructure the features build on first, then the feature branches. This file is
# the only input to a compose: a branch ships to alphanet when it has a line here, and merges
# in this order. Adding one is a commit here, not a label on the pull request.
kind  xrpld
base  XRPLF/rippled develop
target XRPLF/rippled alphanet

# ci: all-amendments supported build workflow, PR #7699
XRPLF/rippled dangell7/supported-cicd rebase
# DatagramMonitor and consensus-testing admin RPCs, PR #8218
XRPLF/rippled dangell7/datagram rebase

# XLS-101d Smart Contracts, PR #5809
XRPLF/rippled dangell/smart-contracts rebase

# Payment channels (XRPLF PRs #7882 whose head lives in Transia-RnD, #7935, #7936), in dependency order.
Transia-RnD/rippled dangell7/escrow-paychan-refactor rebase
XRPLF/rippled token-paychan rebase
XRPLF/rippled dangell7/token-paychan-clawback rebase
# Transia-RnD [ALPHANET] PRs, in their merge order (#27 .. #38). Transia's token-paychan (#30)
# is the XRPLF branch above.
Transia-RnD/rippled dilithium-full rebase
Transia-RnD/rippled feature-p256 rebase
Transia-RnD/rippled dangell7/mpt-structured-data rebase
Transia-RnD/rippled dangell7/token-issuance rebase
Transia-RnD/rippled dangell7/vault-accrual rebase
Transia-RnD/rippled dangell7/coupon-payments rebase
Transia-RnD/rippled dangell7/confidential-voting rebase
Transia-RnD/rippled dangell7/amm-curves rebase
Transia-RnD/rippled dangell7/offer-qualifiers rebase
Transia-RnD/rippled dangell7/subscriptions rebase
Transia-RnD/rippled dangell7/repo-market rebase
Transia-RnD/rippled dangell7/beneficiary rebase
Transia-RnD/rippled dangell7/firewall rebase
