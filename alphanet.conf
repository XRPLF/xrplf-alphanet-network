# Alphanet integration branch: what multibranch-builder merges, in this order, onto the base.
# Format: `<owner/repo> <branch> [rebase]`; `rebase` merges the base branch into that
# branch before it is integrated.
# Order: branches without a PR first (infrastructure the features build on), then the
# feature branches, each with its PR number.
base XRPLF/rippled develop
target Transia-RnD/rippled alphanet

# force_supported cmake option; required for the --force-supported ON build.
XRPLF/rippled dangell7/supported-cicd rebase
XRPLF/rippled dangell7/datagram rebase
XRPLF/rippled dangell7/export-ledger-name-spaces rebase

# XLS-101d Smart Contracts, PR #5809 (labeled alphanet)
XRPLF/rippled dangell/smart-contracts rebase
# XLS-78d Subscriptions, PR #5787 (closed; the Transia-RnD branch is newer and moves over later)
XRPLF/rippled dangell7/subscriptions rebase
